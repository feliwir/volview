[package]
name = "seg"
edition.workspace = true
version.workspace = true

[features]
default = ["cuda"]
# TensorRT does the heavy lifting; the CUDA EP backs up any nodes TensorRT rejects.
cuda = ["ort/cuda", "ort/tensorrt"]

[dependencies]
volio = { path = "../volio" }
anyhow.workspace = true
glam.workspace = true
rayon.workspace = true
tracing.workspace = true
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "tracing", "download-binaries", "tls-native", "copy-dylibs", "api-27"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
