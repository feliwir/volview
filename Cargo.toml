[workspace]
resolver = "3"
members = ["crates/volio", "crates/render", "crates/seg", "crates/app"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
glam = "0.30"
rayon = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
dicom-object = "0.10"
dicom-dictionary-std = "0.10"
dicom-pixeldata = { version = "0.10", features = ["openjp2", "charls"] }
dicom-core = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "hdr"] }
tracing = "0.1"
ash = "0.38"
ash-window = "0.13"
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
winit = "0.30"
raw-window-handle = { version = "0.6", features = ["std"] }
bytemuck = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 2
